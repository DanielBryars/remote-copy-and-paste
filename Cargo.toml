[package]
name = "clipshare"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
gethostname = "1.1.0"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
if-addrs = "0.15.0"
log = "0.4.35"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Pure-Rust primitives only (snow's "std" feature wrongly force-enables ring).
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_Foundation"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

